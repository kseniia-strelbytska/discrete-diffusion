seed: 42
device: auto
decoding_strategy: schedule_driven
sampling_strategy: categorical
temperature: 1.0  # logit scaling temperature
data:
  l: 256
  train_split: 0.9
  batch_size: 64
  grammar: anbn
model:
  architecture: RPE # classic (torch-native) or v2 (QKV low-level) or RPE or FIRE
  max_len: 258       
  vocab_size: 6
  n_head: 4
  n_layers: 4
  embed_dim: 256
  dim_feedforward: 1024
  dropout: 0.1
  layer_norm_eps: 0.0002
  T: 100
  sampling_eps: 0.00001
  eos_weight: 10.0
  inverse_t: False
training:
  epochs: 100000
  learning_rate: 0.001
  num_warmup_steps: 1000
  weight_decay: 0.0
  loss_type: eq8 # eq8 or eq9
  denoise: "0" # "0" or eps
schedule:
  type: categorical  # categorical or gaussian
  sigma: 20.0         # Gaussian width parameter; ignored when type=categorical
validation:
  val_every: 1000
evaluation:
  eval_every: 5000
  n_samples: 100
  eval_dataset: unconditional # limited or randomised or complete
  eval_type: random # full or random
  cutoff: 258
investigation:
  n_first_tokens: 258 # how many first tokens to investigate the distribution of
  store_numeric: True # whether to store numeric logs of the investigation
wandb:
  project: ""
  group: ""
paths:
  models_dir: models
  figures_dir: figures
  experiment_name: uniform-RPE-training
notes: ""
