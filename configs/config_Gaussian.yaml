seed: 42
device: auto
decoding_strategy: schedule_driven
sampling_strategy: greedy
temperature: 0  # logit scaling (scale-invariant for greedy; kept for consistency)
data:
  l: 256
  train_split: 0.9
  batch_size: 64
  grammar: anbn
model:
  architecture: RPE # classic (torch-native) or v2 (QKV low-level) or RPE or FIRE
  max_len: 258       
  vocab_size: 6
  n_head: 4
  n_layers: 4
  embed_dim: 256
  dim_feedforward: 1024
  dropout: 0.1
  layer_norm_eps: 0.0002
  T: 50
  sampling_eps: 0.00001
  sigma: 10.0
  eos_weight: 2.0
  inverse_t: False
training:
  epochs: 10
  learning_rate: 0.001
  num_warmup_steps: 1000
  weight_decay: 0.01
  loss_type: eq8 # eq8 or eq9
  gaussian_noise: True
  denoise: "0" # "0" or eps
schedule:
  type: categorical  # categorical or gaussian
  sigma: 20.0         # Gaussian width parameter; ignored when type=categorical
validation:
  val_every: 1
evaluation:
  eval_every: 1
  n_samples: 100
  eval_dataset: unconditional # limited or randomised or complete
  eval_type: random # full or random
  cutoff: 258
investigation:
  n_first_tokens: 258 # how many first tokens to investigate the distribution of
  store_numeric: True # whether to store numeric logs of the investigation
wandb:
  project: "discrete-diffusion"
  group: "Gaussian-RPE"
paths:
  models_dir: models
  figures_dir: figures
  experiment_name: Gaussian-RPE-investigate
notes: "Unconditional dataset. Use Gaussian gaussian_noise for RPE architecture to investigate the effect of noise on the almost greedy regime"
