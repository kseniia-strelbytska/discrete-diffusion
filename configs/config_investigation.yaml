seed: 42
device: auto
decoding_strategy: schedule_driven
sampling_strategy: categorical
temperature: 0.1  # logit scaling temperature
data:
  l: 256
  train_split: 0.9
  batch_size: 64
  grammar: anbn
model:
  architecture: RPE # classic (torch-native) or v2 (QKV low-level) or RPE or FIRE
  max_len: 258       
  vocab_size: 6
  n_head: 4
  n_layers: 4
  embed_dim: 256
  dim_feedforward: 1024
  dropout: 0.1
  layer_norm_eps: 0.0002
  T: 500
  sampling_eps: 0.00001
  eos_weight: 10.0
  inverse_t: False
evaluation:
  eval_every: 5000
  n_samples: 200
  eval_dataset: randomised # limited or randomised or complete
  eval_type: full # full or random
  cutoff: 256
paths:
  models_dir: models
  figures_dir: figures
  experiment_name: produce-output-log
notes: "Find failing cases"
