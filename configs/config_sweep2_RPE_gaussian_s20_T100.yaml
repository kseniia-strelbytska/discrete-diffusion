seed: 42
device: auto
decoding_strategy: schedule_driven
sampling_strategy: categorical
temperature: 0.00001  # logit scaling temperature
data:
  l: 256
  train_split: 0.9
  batch_size: 64
  grammar: anbn
model:
  architecture: RPE
  max_len: 258
  vocab_size: 6
  n_head: 4
  n_layers: 4
  embed_dim: 256
  dim_feedforward: 1024
  dropout: 0.1
  layer_norm_eps: 0.0002
  T: 100
  sampling_eps: 0.00001
  eos_weight: 10.0
  inverse_t: False
schedule:
  type: gaussian
  sigma: 20.0
training:
  epochs: 100000
  learning_rate: 0.001
  num_warmup_steps: 1000
  weight_decay: 0.0
  loss_type: eq8
  denoise: "0"
validation:
  val_every: 1000
evaluation:
  eval_every: 5000
  n_samples: 100
  eval_dataset: unconditional
  eval_type: random
  cutoff: 258
investigation:
  n_first_tokens: 258
  store_numeric: True
wandb:
  project: "discrete-diffusion"
  group: "RPE-schedule-sweep"
paths:
  models_dir: models
  figures_dir: figures
  experiment_name: sweep2-RPE-gaussian-s20-T100
notes: "Sweep run 2/5: RPE + Gaussian sigma=20, T=100, 100k epochs"
