project: discrete-diffusion
entity: am3049-university-of-cambridge
metric:
  goal: maximize
  name: Rule_Accuracy/eval_both_rules_acc
method: grid
parameters:
  sampling_strategy:
    values: ["greedy", "categorical"]
  eb_gamma: 
    values: [0.1, 0.5, 0.9, 2.0, 5.0, 10.0]
  data.grammar:
    values: ["baN", "bbaN", "aNbN", "parentheses_and_brackets", "aNbNcN", "not_nested_parentheses_and_brackets"]

command:
  - python
  - src/main.py
  - --config
  - configs/config_oracle.yaml
