project: discrete-diffusion
entity: am3049-university-of-cambridge
name: oracle-T-sweep
description: "Oracle model accuracy vs. number of denoising steps T on unconditional data"
metric:
  goal: maximize
  name: Rule_Accuracy/both_rules_acc
method: grid
parameters:
  model.T:
    values: [8, 32, 64, 128, 256, 512, 768, 1024, 1280, 1792, 2048]
command:
  - python
  - src/eval_oracle_T.py
  - --config
  - config_oracle_T_sweep.yaml
  - --save
