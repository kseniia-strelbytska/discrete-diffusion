seed: 42
device: auto
strategy: None
temperature: 0.0   # greedy decoding

data:
  l: 256
  train_split: 0.9
  batch_size: 64
  grammar: anbn
  masking_type: grammar_suffix  # KEY: always reveal all zeros, mask ones+EOS
                                 # Exactly matches eval distribution

model:
  architecture: RPE   # Proven to work (91% with random masking)
  max_len: 258
  vocab_size: 6
  n_head: 4
  n_layers: 6          # More layers than baseline (4→6)
  embed_dim: 256
  dim_feedforward: 1024
  dropout: 0.1
  layer_norm_eps: 0.00001
  T: 500
  sampling_eps: 0.00001
  eos_weight: 10.0
  inverse_t: False

training:
  epochs: 30000
  learning_rate: 0.001
  num_warmup_steps: 1000
  weight_decay: 0.0
  loss_type: eq8
  denoise: ltr         # left-to-right denoising at eval time
  ema_decay: 0.999     # faster warmup than 0.9999 (99.5% effective at epoch 5000)

validation:
  val_every: 500

evaluation:
  eval_every: 5000
  n_samples: 100
  eval_dataset: complete   # l0 in [32,64] — the hard target metric
  eval_type: random
  cutoff: 258

wandb:
  project: ""
  group: ""

paths:
  models_dir: models
  figures_dir: figures
  experiment_name: grammar-suffix-rpe-iter3

notes: "RPE (6L 256d) + grammar_suffix masking + LTR eval + EMA 0.999. Iteration 3."
